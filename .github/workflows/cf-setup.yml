name: cf-setup
# Cloudflare Pages プロジェクト・カスタムドメイン・DNS を作る(冪等。手動実行のみ)。
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PROJECT: career-stats
  DOMAIN: career.harateck.com
  ZONE_NAME: harateck.com
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: pages project (create if missing)
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          if api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT" | jq -e '.success' >/dev/null; then
            echo "project exists"
          else
            api -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" | jq '{success, errors: [.errors[]?.message], subdomain: .result.subdomain}'
          fi
      - name: custom domain on project
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          if api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" | jq -e --arg d "$DOMAIN" '.result[]? | select(.name==$d)' >/dev/null; then
            echo "domain already attached"
          else
            api -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" \
              --data "{\"name\":\"$DOMAIN\"}" | jq '{success, errors: [.errors[]?.message], status: .result.status}'
          fi
      - name: dns CNAME (proxied)
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          ZONE_ID=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | jq -r '.result[0].id')
          echo "zone id length: ${#ZONE_ID}"
          EXISTING=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$DOMAIN" | jq -r '.result[0].id // empty')
          BODY="{\"type\":\"CNAME\",\"name\":\"$DOMAIN\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true,\"ttl\":1}"
          if [ -n "$EXISTING" ]; then
            api -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING" --data "$BODY" | jq '{success, errors: [.errors[]?.message], name: .result.name, content: .result.content}'
          else
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" --data "$BODY" | jq '{success, errors: [.errors[]?.message], name: .result.name, content: .result.content}'
          fi
      - name: domain status
        run: |
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" \
            | jq '[.result[]? | {name, status, certificate_authority}]'
